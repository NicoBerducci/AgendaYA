name: CI Pipeline

on:
  pull_request:
    branches: [main, develop, 'hotfix/**']
  push:
    branches: [main, develop, 'hotfix/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: agenda_ya/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: agenda_ya

      - name: Formato
        run: npm run format:check
        working-directory: agenda_ya

      - name: Lint
        run: npm run lint
        working-directory: agenda_ya

      - name: Type check
        run: npx tsc --noEmit
        working-directory: agenda_ya

      - name: Tests
        run: npm test -- --coverage
        working-directory: agenda_ya

      - name: Security audit
        run: npm audit --omit=dev --audit-level=high
        working-directory: agenda_ya

      - name: Build
        run: npm run build
        working-directory: agenda_ya